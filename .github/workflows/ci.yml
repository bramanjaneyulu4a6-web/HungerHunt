name: CI

on:
  push:
    branches: [main, Ashok-work]
  pull_request:

# A second push supersedes the first; nothing is learned from finishing a run
# against a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # The auth tests stub the model calls they depend on, so no MongoDB
      # service is needed and no .env has to exist. JWT_SECRET only has to be
      # set and consistent; the tests supply their own values for the rest.
      - run: npm test
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret

  shared-files:
    name: Shared files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Guards the files deliberately duplicated across apps. No dependencies —
      # the script uses only node builtins, so there is nothing to install.
      - run: node scripts/check-shared-files.mjs

  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # One app failing to build should not hide whether the other two do.
      fail-fast: false
      matrix:
        app: [frontend-parent, frontend-admin, hungerhunt-kiosk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npx vite build
        working-directory: ${{ matrix.app }}
