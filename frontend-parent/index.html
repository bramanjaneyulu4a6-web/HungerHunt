<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The logo cropped to its mark and scaled down: 6 KB against the 114 KB
         of Logo.jpeg, which the tab was loading in full to draw it 16px wide.
         The JPEG stays for the notification icon, which wants the full square. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to the
         real notch and home-indicator sizes inside the Capacitor shell. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Manage your child's Hunger Hunt wallet, purchase approvals, spending limits and account activity."
    />
    <title>Hunger Hunt — Parent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
