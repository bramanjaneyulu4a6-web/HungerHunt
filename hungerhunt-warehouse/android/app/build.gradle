apply plugin: 'com.android.application'

/* Release signing.
 *
 * This app is installed by hand rather than from Play, which changes what the
 * key protects but not how much it matters. Android refuses an update whose
 * signature does not match the installed copy, and there is no Play App
 * Signing here to reset an upload key — so a lost keystore means visiting every
 * device to uninstall and reinstall, and an uninstall takes the stored
 * session with it. Keep the keystore, and keep it out of the repo: a password
 * in a tracked file is a password in every clone, forever.
 *
 * Two sources, first one wins per value: a keystore.properties next to this
 * project, for a person building on their own machine, and environment
 * variables for anything automated, which has no file to place. Mixing them is
 * allowed — the path in the file, the passwords in the environment.
 *
 * Absent credentials do not quietly degrade. Left alone, a release build with
 * no keystore still succeeds and produces an unsigned APK, which fails at the
 * point of install on the device with a message about the package being
 * invalid — a long way from the missing setup step that caused it. Instead the
 * release refuses to start and names the values it could not find.
 */
def SIGNING_SOURCES = [
    storeFile    : 'ANDROID_KEYSTORE_PATH',
    storePassword: 'ANDROID_KEYSTORE_PASSWORD',
    keyAlias     : 'ANDROID_KEY_ALIAS',
    keyPassword  : 'ANDROID_KEY_PASSWORD',
]

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// A property present but blank is treated as absent. A half-filled template is
// the likeliest way to arrive here, and "" would otherwise sign nothing with a
// key of no name and report no problem doing it.
def readCredential = { String key, String envName ->
    def value = keystoreProperties.getProperty(key) ?: System.getenv(envName)
    return value?.trim() ? value.trim() : null
}

def signingCredentials = SIGNING_SOURCES.collectEntries { key, envName ->
    [(key): readCredential(key, envName)]
}
def missingCredentials = SIGNING_SOURCES.findAll { key, envName -> !signingCredentials[key] }
def canSignRelease = missingCredentials.isEmpty()

android {
    namespace = "com.hungerhunt.warehouse"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hungerhunt.warehouse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Declared only when there is something to declare. An empty config
        // with a null storeFile fails later, deeper, and in Gradle's words
        // rather than in terms of the setup step that was actually skipped.
        if (canSignRelease) {
            release {
                storeFile file(signingCredentials.storeFile)
                storePassword signingCredentials.storePassword
                keyAlias signingCredentials.keyAlias
                keyPassword signingCredentials.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }

            /* Left off deliberately. Capacitor and its plugins reach for classes
               by name, which R8 cannot see and will strip, and the resulting
               failure appears only in the signed build — the one artifact that
               gets least testing before it reaches a device. Turning this on is
               a change to make after a release has shipped, with a device in
               hand, not on the way to a first install. */
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

/* Refuse the release rather than produce an unsigned one.
 *
 * whenReady runs once the task graph is settled and before any task in it has
 * executed, so this costs nothing on a debug build and fails a release
 * immediately rather than after several minutes of work that cannot be used. */
gradle.taskGraph.whenReady { graph ->
    if (canSignRelease) return

    def buildsRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i).*(assemble|bundle|package).*release.*/
    }
    if (!buildsRelease) return

    def wanted = missingCredentials.collect { key, envName -> "  - ${key}  (or \$${envName})" }.join('\n')

    throw new GradleException(
        "Cannot build a release: the signing key is not configured.\n\n" +
        "Missing:\n${wanted}\n\n" +
        "Set them in ${keystorePropertiesFile}, or export them into the\n" +
        "environment. See keystore.properties.example beside this project, and\n" +
        "docs/android-apk-builds.md for creating the keystore.\n\n" +
        "This is deliberate. Building on without them produces an unsigned APK\n" +
        "that the device refuses to install."
    )
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
