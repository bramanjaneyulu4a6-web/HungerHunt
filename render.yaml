# Service definition for the HungerHunt backend on Render.
#
# The live service was created by hand, so this file is the reviewable source
# of truth to MIRROR into the dashboard (Task 11 of the cutover plan) — applying
# it as a Blueprint would create a *second* service; don't, unless intentionally
# recreating from scratch. Values marked sync:false are secrets: set in the
# dashboard from backend/.env.production.local, never committed.
#
# autoDeploy is off on purpose: a push to main must not become a silent
# production deploy. Deploys are triggered manually until the team decides otherwise.
services:
  - type: web
    name: hungerhunt-dbat
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    branch: main
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUSINESS_TIME_ZONE
        value: Asia/Kolkata
      # 3, not 1: Render fronts this service with a three-hop chain. At 1,
      # Express resolved req.ip to a rotating edge address, so one client's
      # failed logins scattered across several rate-limit buckets and ten never
      # accumulated anywhere — the limiter looked configured and never tripped.
      # Confirmed in production 2026-08-18 (401s counting down on one clock,
      # then 429 on the eleventh). Do not lower it without re-testing.
      - key: TRUST_PROXY
        value: "3"
      - key: MAX_ADMIN_ACCOUNTS
        value: "3"
      # Purchase authorization is required from the first request. The default
      # in utils/purchaseAuthorization.js grants a grace window to tills running
      # a pre-token bundle; this deployment has no such clients (every frontend
      # is built fresh from this branch), so the window is closed by backdating.
      - key: PURCHASE_AUTH_GRACE_UNTIL
        value: "2020-01-01T00:00:00Z"
      - key: PARENT_CLIENT_URL
        value: https://hunger-hunt-parent.vercel.app
      - key: ADMIN_CLIENT_URL
        value: https://hunger-hunt-beta.vercel.app
      - key: KIOSK_CLIENT_URL
        value: https://hunger-hunt-kiosk.vercel.app
      - key: WAREHOUSE_CLIENT_URL
        value: https://hunger-hunt-warehouse.vercel.app
      - key: MONGO_URI
        sync: false
      # Connection-pool bounds. Both OPTIONAL: config/mongoPool.js already
      # defaults to exactly these values, so leaving them unset changes
      # nothing. They are named here so that during an incident there is a
      # knob to turn in the dashboard without a deploy.
      #
      # Sized for a shared Atlas tier, where a BIGGER pool is the slower
      # choice: the cluster is throttled, so a large pool merely moves the
      # queue from the driver (in memory, ordered, measurable) into Atlas
      # (invisible, unfair, eventually an error). Raise MONGO_MAX_POOL only on
      # evidence of driver-side waiting, and never above what the cluster's
      # connection cap leaves free after the reconcile cron takes its five.
      #
      # MONGO_MIN_POOL is the one that removes the first-request-after-idle
      # stall: that many sockets stay handshaked through quiet stretches.
      - key: MONGO_MAX_POOL
        value: "20"
      - key: MONGO_MIN_POOL
        value: "5"
      # How long a request waits for a free connection. Thirty seconds looks
      # enormous for a database that answers in one, and it is not sized for
      # the database: bcryptjs on the login path starves the event loop under
      # a burst, and checkout is timed in wall clock, so the starvation is
      # charged here. At 8s a 200-parent sign-in burst failed 48 of them with
      # "Timed out while checking out a connection from connection pool" —
      # 500s for logins the pool could have served.
      #
      # If that error appears in the logs under load, RAISE this; it is
      # almost never a sign that the pool is too small.
      - key: MONGO_WAIT_QUEUE_MS
        value: "30000"
      - key: JWT_SECRET
        sync: false
      - key: PARENT_JWT_SECRET
        sync: false
      - key: STUDENT_JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # PhonePe UPI payments. PHONEPE_PAYMENTS_ENABLED is the backend kill
      # switch, separate from the frontend's build-time VITE_PAYMENTS_ENABLED:
      # false serves 503 on payment creation; flipping it to true with any of
      # the values below missing or invalid makes the service REFUSE TO BOOT
      # (app.js), so set the whole block in the dashboard before flipping it.
      - key: PHONEPE_PAYMENTS_ENABLED
        value: "false"
      # TEMPORARY — sandbox, because the PhonePe merchant is still in Test Mode
      # and unapproved. The live host answers a Test Mode client id with 404
      # Key_not_configured, so `production` here is a checkout that cannot
      # complete at all; sandbox is one PhonePe can review end to end, with
      # test money.
      #
      # app.js permits this ONLY while PHONEPE_TEST_PARENT_PHONES is non-empty
      # (config/paymentConfig.js) — that variable is what keeps a checkout
      # moving no money away from the 222 real families. Clearing it while this
      # says sandbox REFUSES THE BOOT, on purpose.
      #
      # ON APPROVAL: set this to production, replace CLIENT_ID/CLIENT_SECRET/
      # CLIENT_VERSION with the live V2 credentials from the PhonePe dashboard,
      # and change the reconcile cron below in the same deploy.
      - key: PHONEPE_ENV
        value: sandbox
      - key: PHONEPE_CLIENT_VERSION
        value: "1"
      - key: PHONEPE_HTTP_TIMEOUT_MS
        value: "10000"
      # Must be the public origin of the deployed parent app; PhonePe's hosted
      # checkout redirects to <this>/payment-return?intent=...&t=... afterwards.
      - key: PHONEPE_REDIRECT_BASE_URL
        value: https://hunger-hunt-parent.vercel.app
      # Comma-separated parent phones allowed to reach the checkout. Empty
      # means every parent may pay. Set it and only those accounts can — the
      # switch that lets PhonePe review a working checkout while the roll sees
      # none.
      #
      # LOAD-BEARING FOR BOOT while PHONEPE_ENV is sandbox: it is the only
      # thing standing between test money and the real roll, so the service
      # refuses to start without it. It limits who may pay; PHONEPE_ENV decides
      # whether the money is real.
      - key: PHONEPE_TEST_PARENT_PHONES
        sync: false
      - key: PHONEPE_MERCHANT_ID
        sync: false
      # Public identifier issued by PhonePe for the iOS app after its Apple
      # Team ID is registered. This is distinct from the bundle identifier.
      # Optional — the iOS SDK checkout is the only thing that reads it, so a
      # web or Android launch can leave it unset and still boot.
      - key: PHONEPE_IOS_APP_ID
        sync: false
      - key: PHONEPE_CLIENT_ID
        sync: false
      - key: PHONEPE_CLIENT_SECRET
        sync: false
      # Webhook basic-auth pair; the same values are registered on the PhonePe
      # Business dashboard when configuring the webhook URL. Left unset every
      # PhonePe webhook 401s quietly and money only lands via the app's poll
      # and the reconcile sweep below.
      - key: PHONEPE_WEBHOOK_USERNAME
        sync: false
      - key: PHONEPE_WEBHOOK_PASSWORD
        sync: false

  # The net under the webhook: sweeps unfinished PaymentIntents against
  # PhonePe's status API and settles each through the same idempotent
  # settlePaymentIntent the webhook and the app's poll use. Idempotent and
  # read-before-write, so running it while everything is healthy is free.
  # Like the web service above, this is the source of truth to MIRROR into
  # the dashboard by hand, not to apply as a Blueprint.
  - type: cron
    name: hungerhunt-reconcile-payments
    runtime: node
    rootDir: backend
    schedule: "*/15 * * * *"
    buildCommand: npm ci
    startCommand: npm run reconcile:payments
    branch: main
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      # MUST MATCH the web service's PHONEPE_ENV, and be changed in the same
      # deploy. A sweep pointed at the live host reads orders that only exist
      # in sandbox, gets an order-not-found code back, and after AGE_OUT_DAYS
      # ages out intents that were never lost — reconcilePolicy.shouldAgeOut
      # cannot tell "wrong gateway" from "never registered". The script prints
      # which gateway it is on at every run; the two lines must agree.
      - key: PHONEPE_ENV
        value: sandbox
      - key: PHONEPE_CLIENT_VERSION
        value: "1"
      - key: PHONEPE_HTTP_TIMEOUT_MS
        value: "10000"
      - key: PHONEPE_CLIENT_ID
        sync: false
      - key: PHONEPE_CLIENT_SECRET
        sync: false
