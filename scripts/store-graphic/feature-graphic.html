<meta charset="utf-8" />
<title>Hunger Hunt Parent — Play feature graphic</title>
<!--
  The 1024x500 banner Google Play requires on the store listing.

  It is HTML rather than a drawn image so the strapline can change with an edit
  and a re-run instead of a trip through a design tool, and so whatever produced
  the graphic sits in the repo beside it. Render it with
  scripts/render-store-graphic.mjs.

  Nothing here is fetched. Play's graphic is a flat image, and a webfont or a
  linked logo that fails to load renders a different picture than the one anyone
  reviewed - so the mark is a data URI and the type is the system stack.

  Play crops this on some surfaces and lays its own UI over the edges, so the
  whole lockup is held inside a centred 860px band and nothing reaches the
  outer ~120px. The empty margin is the point; do not spread things out to
  fill the canvas.
-->
<style>
  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    /* Exactly the canvas Play asks for; the renderer's window is the same size,
       so what the page paints is what the PNG contains. */
    width: 1024px;
    height: 500px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Drawn from the wordmark's own red rather than picked freshly, so the
       banner and the app icon read as the same product. */
    background: radial-gradient(120% 140% at 22% 18%, #c0141f 0%, #9c0f18 45%, #6e0910 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #ffffff;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 38px;
    /* The safe box. Play's crop and overlays eat the outer band. */
    max-width: 860px;
  }

  .mark {
    flex: none;
    padding: 24px 28px;
    border-radius: 36px;
    background: #ffffff;
    box-shadow: 0 14px 34px rgba(52, 3, 7, 0.32);
  }

  .mark-window {
    /* The logo file is a square with the wordmark underneath the face and a
       wide white margin. Only the face is wanted here - the app name is set in
       type beside it, and showing both would say "Hunger Hunt" twice. So the
       full image is used as a background and this element is the window onto
       the face. It is a separate element rather than a background on the card
       because a background is clipped to the border box, not the padding box:
       windowed on the card itself, the top of the wordmark shows through the
       padding.

       Crop box, in the 1024px coordinates of the original artwork: x 296,
       y 168, 400 wide, 448 tall. That stops just short of the fries on the
       right and just above the "HUNGER" lettering below. --k scales the box to
       the size drawn here and every other number is derived from it, so
       resizing the mark means changing --k alone. */

    display: block;
    width: calc(400px * var(--k));
    height: calc(448px * var(--k));
